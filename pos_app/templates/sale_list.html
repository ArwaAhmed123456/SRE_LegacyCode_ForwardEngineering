{% extends 'base.html' %}

{% block title %}Sales{% endblock %}

{% block content %}
<h1>Sales</h1>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Date</th>
            <th>Employee</th>
            <th>Total</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for sale in sales %}
            <tr>
                <td>{{ sale.id }}</td>
                <td>{{ sale.date }}</td>
                <td>{{ sale.employee.first_name }} {{ sale.employee.last_name }}</td>
                <td>${{ sale.total }}</td>
                <td><a href="{% url 'sale_detail' sale.pk %}" class="btn">View Details</a></td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
